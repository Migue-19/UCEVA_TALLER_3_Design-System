<dsb-container-atom title="Navbar">
    <dsb-navbar-organism [navbarConfig]="navbarConfig"></dsb-navbar-organism>
</dsb-container-atom>

<dsb-container-atom title="User Profile Card">
    @if (statusMessage) {
        <div class="alert alert-success alert-dismissible fade show mb-4 py-2 px-3 small" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            {{ statusMessage }}
        </div>
    }

    <section class="row g-4 justify-content-center">
        <div class="col-lg-6 col-md-8">
            <h6 class="text-secondary fw-semibold mb-3">
                <i class="bi bi-person-badge me-2"></i>Perfil con Fotografía y Acciones
            </h6>
            <dsb-user-profile-card-organism
                [config]="adminProfileCard"
                (save)="onSaveProfile($event)"
                (cancel)="onCancelProfile()">
            </dsb-user-profile-card-organism>
        </div>

        <div class="col-lg-6 col-md-8">
            <h6 class="text-secondary fw-semibold mb-3">
                <i class="bi bi-person-circle me-2"></i>Perfil con Iniciales de Respaldo
            </h6>
            <dsb-user-profile-card-organism
                [config]="studentProfileCard"
                (save)="onSaveProfile($event)"
                (cancel)="onCancelProfile()">
            </dsb-user-profile-card-organism>
        </div>
    </section>
</dsb-container-atom>
